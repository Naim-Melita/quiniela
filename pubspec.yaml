name: quiniela
description: "Quiniela24 - resultados oficiales de la quiniela argentina, generador de jugadas y estadisticas."
publish_to: 'none'

version: 1.0.0+20260820

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Inter (UI) y JetBrains Mono (numeros) del design system de Stitch.
  google_fonts: ^6.2.1
  intl: ^0.20.2
  http: ^1.6.0
  # Para el extracto oficial de la Ciudad, que se publica en XML.
  xml: ^6.6.1
  # Cache en disco de los resultados ya publicados.
  path_provider: ^2.1.6
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
