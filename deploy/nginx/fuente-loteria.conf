# Incluir dentro del bloque HTTPS de `server_name quiniela24.armelix.dev`.
# Solo expone las dos rutas que consume Quiniela24; no convierte el dominio en
# un proxy abierto al resto del sitio remoto.

location = /fuente-loteria/ {
    proxy_pass https://quiniela.loteriadelaciudad.gob.ar/;
    proxy_ssl_server_name on;
    proxy_ssl_name quiniela.loteriadelaciudad.gob.ar;
    proxy_set_header Host quiniela.loteriadelaciudad.gob.ar;
    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
}

location /fuente-loteria/resultadosQuiniela/ {
    proxy_pass https://quiniela.loteriadelaciudad.gob.ar/resultadosQuiniela/;
    proxy_ssl_server_name on;
    proxy_ssl_name quiniela.loteriadelaciudad.gob.ar;
    proxy_set_header Host quiniela.loteriadelaciudad.gob.ar;
    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
}

# Endpoint actual: devuelve todas las jurisdicciones de un sorteo.
location = /fuente-loteria/includes/resultados-data.php {
    proxy_pass https://quiniela.loteriadelaciudad.gob.ar/includes/resultados-data.php;
    proxy_ssl_server_name on;
    proxy_ssl_name quiniela.loteriadelaciudad.gob.ar;
    proxy_set_header Host quiniela.loteriadelaciudad.gob.ar;
    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
}
